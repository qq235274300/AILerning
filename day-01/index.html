<!DOCTYPE html>
<html>
<body>

<h2>UE Agent Assistant</h2>

<textarea id="question" rows="5" cols="50">
分析 day-01/RAG/chroma.py 这个文件有什么问题
</textarea>

<br>

<button onclick="send()">发送</button>

<div id="answer">
    <h3>Agent Status</h3>
    <pre id="status"></pre>

    <h3>Final Answer</h3>
    <pre id="final_answer"></pre>

    <h3>Events</h3>
    <pre id="events"></pre>

    <h3>Raw Stream</h3>
    <pre id="raw"></pre>
</div>


<script>

async function send(){

    const question = document.getElementById("question").value;

    const statusBox = document.getElementById("status");
    const finalAnswerBox = document.getElementById("final_answer");
    const eventsBox = document.getElementById("events");
    const rawBox = document.getElementById("raw");

    statusBox.textContent = "";
    finalAnswerBox.textContent = "";
    eventsBox.textContent = "";
    rawBox.textContent = "";

    const response = await fetch(
        "http://127.0.0.1:8000/agent/stream",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                question:question
            })
        }
    );

    if(!response.ok){
        rawBox.textContent = "Request failed: " + response.status;
        return;
    }

    const reader = response.body.getReader();

    const decoder = new TextDecoder();

    let fullText = "";
    let pendingLine = "";

    while(true){

        const {
            done,
            value
        } = await reader.read();


        if(done){
            break;
        }


        const text = decoder.decode(
            value,
            {
                stream:true
            }
        );

        fullText += text;
        rawBox.textContent = fullText;

        pendingLine += text;

        const lines = pendingLine.split("\n");
        pendingLine = lines.pop();

        for(const line of lines){
            handleAgentEvent(line);
        }
    }

    const tail = pendingLine + decoder.decode();
    if(tail.trim()){
        handleAgentEvent(tail);
    }

}

function handleAgentEvent(line){

    if(!line.trim()){
        return;
    }

    const statusBox = document.getElementById("status");
    const finalAnswerBox = document.getElementById("final_answer");
    const eventsBox = document.getElementById("events");

    try{
        const event = JSON.parse(line);

        statusBox.textContent = event.event;
        eventsBox.textContent += JSON.stringify(
            event,
            null,
            2
        ) + "\n\n";

        if(event.event === "final"){
            finalAnswerBox.textContent = event.data.final_answer || "";
        }
    }
    catch(error){
        eventsBox.textContent += "Failed to parse event: " + line + "\n";
    }

}

</script>

</body>
</html>
